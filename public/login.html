<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Assur Electronics</title>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      margin: 0;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 24px 20px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    h1 { margin-top: 0; font-size: 22px; }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: #d2691e;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover { background: #b85c1a; }

    .error { color: #b00020; margin-top: 10px; font-size: 14px; }

    .switch-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
    }

    .switch-link a { color: #d2691e; text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Log In</h1>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit">Log In</button>
      <p class="error" id="errorMsg"></p>
    </form>

   <p class="switch-link">Don't have an account? <a href="register.html" id="registerLink">Register</a></p>

  <script src="js/api.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    // If checkout redirected here, send the customer back after login
    const redirectTo = new URLSearchParams(window.location.search).get("redirect") || "products.html";
document.getElementById("registerLink").href = `register.html?redirect=${encodeURIComponent(redirectTo)}`;
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.textContent = "";

      try {
        const data = await api.customerLogin(
          document.getElementById("email").value,
          document.getElementById("password").value
        );

        localStorage.setItem("customerToken", data.token);
        localStorage.setItem("customerUser", JSON.stringify(data.user));
        window.location.href = redirectTo;
      } catch (err) {
        errorMsg.textContent = err.message;
      }
    });
  </script>
</body>
</html>
